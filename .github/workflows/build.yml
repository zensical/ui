name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

jobs:
  build:
    name: Templates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Node.js dependencies
        run: npm ci

      - name: Build artifact
        run: npm run build

      - name: Build Python distributions
        run: |
          python -m pip install build twine
          python -m build --outdir artifacts

      - name: Check Python distributions
        run: |
          python tools/check-package.py artifacts
          python -m twine check --strict artifacts/*.whl artifacts/zensical_ui-*.tar.gz

      - name: Create artifacts archive
        run: tar -C dist -czf artifacts/templates.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: templates
          path: artifacts/templates.tar.gz
          if-no-files-found: error

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python
          path: |
            artifacts/zensical_ui-*.whl
            artifacts/zensical_ui-*.tar.gz
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    permissions:
      contents: read
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python
          path: artifacts

      - name: Install package
        run: python -m pip install --no-index --no-deps --find-links artifacts zensical-ui

      - name: Check installed resources
        run: >-
          python -c
          "from pathlib import Path;
          from zensical_ui import get_theme_dir;
          root = Path(get_theme_dir());
          assert (root / 'base.html').is_file();
          assert (root / '.icons/lucide/external-link.svg').is_file();
          assert (root / 'assets/images/favicon.png').is_file();
          print(root)"

  attestations:
    name: Attestations
    if: inputs.attestations == true
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: templates
          path: artifacts

      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python
          path: artifacts

      - name: Create artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          show-summary: false
          subject-path: artifacts/*
