name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: >-
    ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  build:
    name: Templates
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/npm-cache
          key: >-
            npm-${{ runner.os }}-${{ runner.arch }}-node24-${{
                hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Set up Node.js dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm ci --prefer-offline --no-audit

      - name: Save npm cache
        if: >-
          ${{ steps.npm-cache.outputs.cache-hit != 'true' &&
              github.event_name == 'push' &&
              github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/npm-cache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Build artifact
        run: npm run build

      - name: Build Python distributions
        run: |
          python -m pip install build twine
          python -m build --outdir artifacts

      - name: Check Python distributions
        run: |
          python tools/check-package.py artifacts
          python -m twine check --strict \
            artifacts/*.whl artifacts/zensical_ui-*.tar.gz

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python
          path: |
            artifacts/zensical_ui-*.whl
            artifacts/zensical_ui-*.tar.gz
          if-no-files-found: error

  test:
    name: ${{ matrix.os.name }} (${{ matrix.python-version }})
    needs: build
    permissions:
      contents: read
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        os:
          - name: Linux
            runner: ubuntu-26.04
          - name: Windows
            runner: windows-2022
          - name: macOS
            runner: macos-15
        python-version: ["3.11", "3.14"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python
          path: artifacts

      - name: Install package
        run: >-
          python -m pip install --no-index --no-deps
          --find-links artifacts zensical-ui

      - name: Check installed resources
        run: >-
          python -c
          "from pathlib import Path;
          from zensical_ui import get_theme_dir;
          root = Path(get_theme_dir());
          assert (root / 'base.html').is_file();
          assert (root / '.icons/lucide/external-link.svg').is_file();
          assert (root / 'assets/images/favicon.png').is_file();
          print(root)"

  release:
    name: Release
    if: |
      always() &&
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release/')
    needs:
      - build
      - test
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success")'
          <<< "$RESULTS"

  attestations:
    name: Attestations
    if: inputs.attestations == true
    needs:
      - build
      - test
    permissions:
      contents: read
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python
          path: artifacts

      - name: Create artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          show-summary: false
          subject-path: artifacts/*
