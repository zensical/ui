[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "zensical-ui"
description = "Templates and browser assets for Zensical"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zensical", email = "contributors@zensical.org" }
]
dynamic = ["version"]

[project.urls]
Homepage = "https://zensical.org/"
Documentation = "https://zensical.org/docs/"
Source = "https://github.com/zensical/ui/"
Issues = "https://github.com/zensical/ui/issues"

[tool.hatch.version]
path = "package.json"
pattern = '"version"\s*:\s*"(?P<version>[^"]+)"'

[tool.hatch.build]
directory = "artifacts"

[tool.hatch.build.targets.wheel]
only-include = ["python/zensical_ui", "dist"]
artifacts = ["dist/**"]

[tool.hatch.build.targets.wheel.sources]
"python" = ""
"dist" = "zensical_ui/templates"

[tool.hatch.build.targets.sdist]
only-include = [
    "python/zensical_ui",
    "dist",
    "src",
    "tools",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
]
artifacts = ["dist/**"]
